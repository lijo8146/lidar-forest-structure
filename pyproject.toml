[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "lidar-forest-structure"
version = "0.1.0"
description = "Auditable LAS/LAZ to terrain and vegetation structure workflow"
requires-python = ">=3.11"
dependencies = ["laspy>=2.6,<3","numpy>=1.26,<3","scipy>=1.12,<2","rasterio>=1.3,<2","pyproj>=3.6,<4","matplotlib>=3.8,<4","PyYAML>=6,<7"]
[project.scripts]
lidar-forest = "lidarforest.cli:main"
[tool.setuptools.packages.find]
include = ["lidarforest*"]
